name: Build Arena

# Builds arena/ into a single Windows exe, checks that the packaged build can
# actually run a tournament, and publishes the participants' downloads:
# Arena.zip, Arena.exe plus the starter pack (README and bot templates in
# Python, Java, C and C++), and Arena-Kit.zip, the flash-drive kit: the same
# with Python, a JDK and MinGW gcc/g++ alongside, so nothing needs installing.
# It also builds Show.exe, the organisers' show (organizer/show.py), which is
# in neither download. Runs only when a GitHub release is published, and
# attaches all three to it.
#
# The game is whichever one the release's branch plays (arena/rules.py): the
# ipd branch for the event, the rps branch for the practice pack.

on:
  release:
    types: [published]

permissions:
  contents: write  # to attach the zip to the release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50  # a hung step must not run for hours; the kit's downloads take a while
    defaults:
      run:
        shell: pwsh
        working-directory: arena
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # what the flash-drive kit ships

      - name: Which game this is
        id: game
        run: |
          $key = python -c "from rules import GAME; print(GAME.key)"
          $moves = python -c "from rules import GAME; print(''.join(GAME.moves))"
          "key=$key" >> $env:GITHUB_OUTPUT
          "moves=$moves" >> $env:GITHUB_OUTPUT
          Write-Host "building the Arena for: $key (moves $moves)"

      - name: A practice build must not give the real game away
        # The exe is these sources plus Python itself, so checking them is
        # checking everything a team could unpack from it.
        if: steps.game.outputs.key != 'ipd'
        working-directory: .
        run: |
          $words = "prisoner", "cooperat", "defect", "tit.for.tat", "titfortat", "pavlov", "grudge", "\bipd\b"
          $files = @(Get-ChildItem arena -Filter *.py) + @(Get-ChildItem starter -Recurse -File)
          $leaks = foreach ($f in $files) {
            foreach ($w in $words) {
              Select-String -Path $f.FullName -Pattern $w | ForEach-Object { "$($f.Name):$($_.LineNumber): $w" }
            }
          }
          if ($leaks) { $leaks | Write-Host; throw "the practice build names the real game" }
          Write-Host "nothing in the practice build names the real game"

      - name: Every template builds and plays
        # Built the way the Arena builds them, with the runner's JDK and MinGW
        # gcc/g++, then played over the real protocol.
        working-directory: .
        run: |
          $moves = "${{ steps.game.outputs.moves }}"
          $session = "RESET`nROUND - -`nROUND $($moves[0]) $($moves[-1])`nEND"
          $work = Join-Path $env:RUNNER_TEMP "templates"
          Copy-Item -Recurse starter\templates $work
          Push-Location $work
          javac java\MyBot.java
          if ($LASTEXITCODE) { throw "javac failed" }
          gcc -O2 -static -o c\my_bot.exe c\my_bot.c -lm
          if ($LASTEXITCODE) { throw "gcc failed" }
          g++ -O2 -std=c++17 -static -o cpp\my_bot.exe cpp\my_bot.cpp
          if ($LASTEXITCODE) { throw "g++ failed" }
          $runs = [ordered]@{
            "Python" = { $session | python python\my_bot.py }
            "Java"   = { $session | java -cp java MyBot }
            "C"      = { $session | .\c\my_bot.exe }
            "C++"    = { $session | .\cpp\my_bot.exe }
          }
          foreach ($name in $runs.Keys) {
            $reply = & $runs[$name]
            if (($reply -join "") -notmatch "^[$moves]+$") {
              throw "the $name template did not play: '$reply'"
            }
            Write-Host "$name replied: $($reply -join ' ')"
          }
          Pop-Location

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller==6.*"

      - name: Build Arena.exe
        # The sparring partners are imported by name when a tournament
        # starts, so name them explicitly.
        run: >
          pyinstaller --onefile --windowed --name Arena
          --hidden-import sparring --hidden-import harness --hidden-import rules
          arena.py

      - name: Self-test the packaged exe
        # Runs a small tournament headlessly: exercises the frozen worker
        # processes and a real Python bot over the protocol. A windowed exe
        # has no console, so the result comes back through a report file,
        # written as it goes (it says where it got to, even if it hangs).
        # Wait for Arena.exe alone: Start-Process -Wait would also wait for
        # every process it started, forever if one is left behind.
        timeout-minutes: 6
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath dist\Arena.exe -ArgumentList '--selftest', "`"$report`"" -PassThru
          $null = $p.Handle   # keeps the exit code readable after it exits
          $finished = $p.WaitForExit(240000)
          if (-not $finished) { taskkill /PID $p.Id /T /F | Out-Null }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "(no report was written)" }
          $left = Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -like "*Arena*" -or $_.Name -in "python.exe", "py.exe" }
          if ($left) {
            Write-Host "processes still running after the self-test:"
            $left | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize | Out-String -Width 400 | Write-Host
          }
          if (-not $finished) { throw "Arena.exe self-test did not finish within 4 minutes" }
          if ($p.ExitCode -ne 0) { throw "Arena.exe self-test failed (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern "game: ${{ steps.game.outputs.key }}")) {
            throw "the exe is not playing ${{ steps.game.outputs.key }}"
          }

      - name: Build Show.exe
        # The show replays a tournament file: it runs no bots, but it needs
        # the engine's modules from arena/, the sparring partners among them.
        run: >
          pyinstaller --onefile --windowed --name Show --paths .
          --hidden-import sparring --hidden-import harness --hidden-import rules
          --hidden-import finder --hidden-import game
          ..\organizer\show.py

      - name: Self-test the packaged show
        # Replays the tournament the Arena's self-test saved beside its
        # report: every highlight, then the timelapse to the champion.
        timeout-minutes: 4
        run: |
          $report = Join-Path $PWD "show-selftest.txt"
          $tournament = Join-Path $PWD "selftest.jsonl"
          $p = Start-Process -FilePath dist\Show.exe -ArgumentList '--selftest', "`"$report`"", "`"$tournament`"" -PassThru
          $null = $p.Handle   # keeps the exit code readable after it exits
          $finished = $p.WaitForExit(120000)
          if (-not $finished) { taskkill /PID $p.Id /T /F | Out-Null }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "(no report was written)" }
          if (-not $finished) { throw "Show.exe self-test did not finish within 2 minutes" }
          if ($p.ExitCode -ne 0) { throw "Show.exe self-test failed (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern "game: ${{ steps.game.outputs.key }}")) {
            throw "the show is not playing ${{ steps.game.outputs.key }}"
          }

      - name: Assemble the download
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\Arena.exe, ..\starter\README.md package\
          Copy-Item -Recurse ..\starter\templates package\templates
          Compress-Archive -Path package\* -DestinationPath Arena.zip -Force

      - name: Build the flash-drive kit
        # make-kit.ps1 downloads the toolchains, assembles the kit around the
        # Arena.exe just built and tested, and checks the result: every
        # template built and played with the bundled tools, and the Arena's
        # self-test. The download hashes it records are printed, to pin in
        # kit/hashes.json.
        working-directory: .
        timeout-minutes: 25
        run: |
          & ./kit/make-kit.ps1 -Arena arena\dist\Arena.exe -Out Arena-Kit -TrimJdk
          Write-Host "download hashes:"
          Get-Content kit\hashes.json

      - name: A practice kit must not give the real game away either
        # The kit adds text of its own (README.txt, Shell here.cmd) to the
        # starter pack; the toolchains are the stock downloads.
        if: steps.game.outputs.key != 'ipd'
        working-directory: .
        run: |
          $words = "prisoner", "cooperat", "defect", "tit.for.tat", "titfortat", "pavlov", "grudge", "\bipd\b"
          $files = @(Get-ChildItem Arena-Kit -File | Where-Object { $_.Extension -in ".txt", ".md", ".cmd" }) +
                   @(Get-ChildItem Arena-Kit\templates -Recurse -File)
          $leaks = foreach ($f in $files) {
            foreach ($w in $words) {
              Select-String -Path $f.FullName -Pattern $w | ForEach-Object { "$($f.Name):$($_.LineNumber): $w" }
            }
          }
          if ($leaks) { $leaks | Write-Host; throw "the practice kit names the real game" }
          Write-Host "nothing in the practice kit names the real game"

      - name: Zip the kit
        working-directory: .
        run: |
          7z a -tzip -mx=5 Arena-Kit.zip .\Arena-Kit\* | Out-Null
          if ($LASTEXITCODE) { throw "7z failed" }
          "Arena-Kit.zip: {0:N0} MB" -f ((Get-Item Arena-Kit.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Arena-${{ steps.game.outputs.key }}
          path: arena/package/

      - uses: actions/upload-artifact@v4
        with:
          name: Arena-Kit-${{ steps.game.outputs.key }}
          path: Arena-Kit.zip
          compression-level: 0  # already zipped

      - uses: actions/upload-artifact@v4
        with:
          name: Show-${{ steps.game.outputs.key }}
          path: arena/dist/Show.exe

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            arena/Arena.zip
            Arena-Kit.zip
            arena/dist/Show.exe
